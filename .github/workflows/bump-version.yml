name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate and apply version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $cargo = Get-Content -Raw -LiteralPath Cargo.toml
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"')
          if (-not $match.Success) { throw 'Package version not found in Cargo.toml' }

          $parts = [int[]]$match.Groups['version'].Value.Split('.')
          switch ($env:BUMP) {
            'major' { $parts[0]++; $parts[1] = 0; $parts[2] = 0 }
            'minor' { $parts[1]++; $parts[2] = 0 }
            'patch' { $parts[2]++ }
            default { throw "Unsupported bump: $env:BUMP" }
          }

          $version = $parts -join '.'
          $updated = $cargo.Remove($match.Groups['version'].Index, $match.Groups['version'].Length).Insert($match.Groups['version'].Index, $version)
          Set-Content -LiteralPath Cargo.toml -Value $updated -NoNewline

          $issPath = "installer/Winsentials.iss"
          if (Test-Path $issPath) {
            $iss = Get-Content -Raw -LiteralPath $issPath
            $iss = [regex]::Replace($iss, '(?m)^(\s*#define\s+AppVersion\s+)"\d+\.\d+\.\d+"', "`${1}`"$version`"")
            Set-Content -LiteralPath $issPath -Value $iss -NoNewline
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Update lockfile
        run: cargo update --workspace

      - name: Validate lockfile version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lock = Get-Content -Raw -LiteralPath Cargo.lock
          $pattern = '(?ms)^\[\[package\]\]\s*name = "winsentials"\s*version = "' + [regex]::Escape($env:VERSION) + '"'
          if ($lock -notmatch $pattern) { throw "Cargo.lock does not contain winsentials $env:VERSION" }

      - name: Ensure labels exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh label create version-bump --color D4A72C --description 'Automated version bump' --force
          gh label create automated-pr --color 6F42C1 --description 'Created by automation' --force

      - name: Create version bump pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          branch: chore/version-bump-${{ steps.version.outputs.tag }}
          delete-branch: true
          commit-message: "chore: bump version to ${{ steps.version.outputs.tag }}"
          title: "chore: bump version to ${{ steps.version.outputs.tag }}"
          labels: |
            version-bump
            automated-pr
          body: |
            Automated Winsentials version bump to `${{ steps.version.outputs.tag }}`.

            - Updates `Cargo.toml` and `Cargo.lock`.
            - The release is promoted only from artifacts produced by the successful PR Build workflow.
